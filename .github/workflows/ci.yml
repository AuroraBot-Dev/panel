name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  validate:
    name: Validate AuroraBot Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Build Mock API
        run: pnpm -F @vben/backend-mock build

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Package dist
        run: |
          cd apps/web/dist
          zip -r ../../../aurorabot-panel-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            aurorabot-panel-${{ github.ref_name }}.zip \
            --title "${{ github.ref_name }}" \
            --notes "AuroraBot Panel ${{ github.ref_name }} 静态构建产物。部署说明见仓库 README「发布与部署」一节。"
